<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Plus-Lernspiel – Rechenstrategien</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="level-select" role="group" aria-label="Level auswählen">
      <button class="level-btn active" data-level="1" aria-label="ZR 6"><span class="lvl-main">ZR 6</span><span class="lvl-sub">&nbsp;</span></button>
      <button class="level-btn" data-level="2" aria-label="ZR 10"><span class="lvl-main">ZR 10</span><span class="lvl-sub">&nbsp;</span></button>
      <button class="level-btn" data-level="3" aria-label="ZR 20"><span class="lvl-main">ZR 20</span><span class="lvl-sub">&nbsp;</span></button>
      <button class="level-btn" data-level="4" aria-label="ZR 100 ZE+E / ZE+Z"><span class="lvl-main">ZR 100</span><span class="lvl-sub">ZE+E / ZE+Z</span></button>
      <button class="level-btn" data-level="5" aria-label="ZR 100 ZE+ZE oÜ"><span class="lvl-main">ZR 100</span><span class="lvl-sub">ZE+ZE oÜ</span></button>
      <button class="level-btn" data-level="6" aria-label="ZR 100 ZE+ZE mÜ"><span class="lvl-main">ZR 100</span><span class="lvl-sub">ZE+ZE mÜ</span></button>
    </div>
    <div class="top-controls">
      <div class="control-group">
        <button id="homeBtn" class="ctrl-btn icon-btn home-btn" type="button" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2" fill="none" stroke="#263445" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="#263445" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
        <button id="fullscreenBtn" class="ctrl-btn icon-btn" type="button" title="Vollbild" aria-label="Im Vollbild spielen" aria-pressed="false"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#263445" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="animBtn" class="ctrl-btn icon-btn anim-btn active" type="button" title="Animation ein- oder ausschalten" aria-label="Animation ein- oder ausschalten" aria-pressed="true"><svg class="anim-icon" viewBox="0 0 44 40" width="40" height="36" aria-hidden="true"><rect x="4" y="3" width="9" height="34" rx="2" fill="#bfdbfe" stroke="#6b9dd8" stroke-width="1.5"/><line x1="4" x2="13" y1="6.4" y2="6.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="9.8" y2="9.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="13.2" y2="13.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="16.6" y2="16.6" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="20.0" y2="20.0" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="23.4" y2="23.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="26.8" y2="26.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="30.2" y2="30.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="4" x2="13" y1="33.6" y2="33.6" stroke="#6b9dd8" stroke-width="0.8"/><rect x="17" y="3" width="9" height="34" rx="2" fill="#bfdbfe" stroke="#6b9dd8" stroke-width="1.5"/><line x1="17" x2="26" y1="6.4" y2="6.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="9.8" y2="9.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="13.2" y2="13.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="16.6" y2="16.6" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="20.0" y2="20.0" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="23.4" y2="23.4" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="26.8" y2="26.8" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="30.2" y2="30.2" stroke="#6b9dd8" stroke-width="0.8"/><line x1="17" x2="26" y1="33.6" y2="33.6" stroke="#6b9dd8" stroke-width="0.8"/><rect x="31" y="3" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><rect x="31" y="14" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><rect x="31" y="25" width="9" height="9" rx="2" fill="#bbf7d0" stroke="#65a887" stroke-width="1.5"/><line class="anim-strike" x1="2" y1="38" x2="42" y2="2" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/></svg></button>
        <button id="directBtn" class="ctrl-btn icon-btn direct-btn" type="button" title="Ohne Rechenschritte: Ergebnis direkt eingeben" aria-label="Ohne Rechenschritte rechnen ein- oder ausschalten" aria-pressed="false"><svg viewBox="0 0 44 30" width="40" height="28" aria-hidden="true"><text x="2" y="23" font-size="24" font-weight="900" fill="#263445" font-family="system-ui,Arial">=</text><rect x="20" y="4" width="21" height="22" rx="5" fill="#fff7d6" stroke="#263445" stroke-width="2.2"/></svg></button>
        <button id="leaveBtn" class="ctrl-btn leave-btn" type="button" title="Durchgang beenden" aria-label="Durchgang beenden">Ende</button>
      </div>
      <div class="control-group counts" aria-label="Zähler">
        <div class="count-box count-ok" title="Beim ersten Versuch richtig">✓ <span id="okCount">0</span></div>
        <div class="count-box count-bad" title="Beim ersten Versuch falsch">✗ <span id="badCount">0</span></div>
      </div>
    </div>
  </header>

  <main id="game">
    <section class="board-panel" aria-label="Zwanzigerfeld und Animation">
      <div id="pointsWrap" class="points-wrap">
        <div id="pointsField" class="points-field" aria-label="20er-Feld"></div>
        <div id="redFrame" class="frame red-frame" aria-hidden="true"></div>
        <div id="greenFrame" class="frame green-frame" aria-hidden="true"></div>
        <div id="fadeMask" class="fade-mask" aria-hidden="true"></div>
        <div id="labelTop" class="board-label" aria-hidden="true"></div>
        <div id="labelBottom" class="board-label" aria-hidden="true"></div>
      </div>
      <div id="placeBoard" class="place-board" hidden aria-label="Stellenwertfelder: gelb 1. Summand, blau 2. Summand, grün Summe"></div>
      <div id="strategyHint" class="strategy-hint" aria-live="polite"></div>
    </section>

    <section class="work-panel" aria-label="Rechenaufgabe">
      <div class="progress-row"><span id="progressText">Aufgabe 1 von 10</span><span id="progressDots" aria-hidden="true"></span></div>
      <div class="equation-row">
        <div id="taskText" class="task-text">2 + 3</div><div class="equals">=</div>
        <input id="answerInput" class="answer-input" aria-label="Ergebnis" inputmode="none" autocomplete="off" readonly>
      </div>
      <div id="zrSteps" class="zr-steps" hidden aria-live="polite"></div>
      <div id="zrChoice" class="zr-choice" hidden>
        <div id="zrChoiceTitle" class="strategy-title">1. Rechenschritt wählen:</div>
        <div id="zrButtons" class="zr-buttons"></div>
      </div>
      <div class="strategy-area" id="strategyArea" hidden>
        <div class="strategy-title">Welche Strategie passt?</div>
        <div class="strategy-buttons">
          <button class="strategy-btn" data-strategy="double"><span>🦋</span>Verdoppeln</button>
          <button class="strategy-btn" data-strategy="hand"><span>✋</span>Handaufgabe</button>
          <button class="strategy-btn" data-strategy="nine"><span>9</span>9er-Trick</button>
          <button class="strategy-btn" data-strategy="ten"><span>10</span>10er-Stopp</button>
          <button class="strategy-btn" data-strategy="giant"><span><svg class="giant-dwarf" viewBox="0 0 48 40" width="46" height="38" aria-hidden="true"><g fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.6" stroke-linejoin="round"><circle cx="14" cy="6.5" r="4.6" fill="#fcd9b6" stroke="#9a5b2e"/><path d="M7 13.5h14l2 13h-3.2l-0.8 12h-3.6l-1.4-10-1.4 10H8.8L8 26.5H4.8z"/><circle cx="37" cy="23" r="3.4" fill="#fcd9b6" stroke="#9a5b2e"/><path d="M30.5 17.8 37 9.5l6.5 8.3z" fill="#ef4444" stroke="#991b1b"/><path d="M32.5 27.5h9l1.4 6.5h-2l-0.5 4.5h-2.6l-0.8-3.6-0.8 3.6h-2.6l-0.5-4.5h-2z" fill="#34d399" stroke="#065f46"/></g></svg></span>Riese–Zwerg</button>
        </div>
      </div>
      <div class="bottom-row"><span id="feedback" role="status" aria-live="polite"></span><button id="nextBtn" class="next-btn" hidden>Weiter</button></div>
    </section>

    <section class="keypad-panel" aria-label="Ziffernfeld">
      <div id="keypad" class="keypad">
        <button class="key-btn" data-key="1">1</button><button class="key-btn" data-key="2">2</button><button class="key-btn" data-key="3">3</button><button class="key-btn" data-key="4">4</button><button class="key-btn" data-key="5">5</button><button class="key-btn" data-key="6">6</button><button class="key-btn" data-key="7">7</button><button class="key-btn" data-key="8">8</button><button class="key-btn" data-key="9">9</button><button class="key-btn" data-key="0">0</button><button class="key-btn utility" data-key="clear" aria-label="Eingabe löschen">C</button><button class="key-btn utility key-del" data-key="back" aria-label="Letzte Ziffer löschen">⌫</button>
      </div>
    </section>
  </main>

  <section id="resultPanel" class="result-panel" hidden aria-live="polite">
    <div id="resultCelebration" class="celebration" aria-hidden="true"></div>
    <div id="resultScore" class="result-score">18 von 20 Aufgaben richtig.</div>
    <div id="resultTime" class="result-time">Zeit: 2:34</div>
    <div id="resultDetails" class="result-details"></div>
    <div class="result-actions"><button id="againBtn" class="next-btn">Noch einmal</button><button id="resultLevelBtn" class="secondary-btn">Level wählen</button></div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
